name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm prod destruction'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-terraform
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: infra/live/prod

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod

    if: github.event.inputs.confirm_destroy == 'DESTROY'

    steps:
      - uses: actions/checkout@v4

      - name: Show Azure IDs
        run: |
          echo "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
          echo "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          echo "AZURE_CLIENT_ID_APPLY=${{ vars.AZURE_CLIENT_ID_APPLY }}"
          echo "TFSTATE_RG=${{ vars.TFSTATE_RG }}"
          echo "TFSTATE_SA=${{ vars.TFSTATE_SA }}"
          echo "TFSTATE_CONTAINER=${{ vars.TFSTATE_CONTAINER }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=prod.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Pre-destroy Kubernetes cleanup
        run: |
          set +e

          AKS_NAME=$(terraform output -raw aks_name 2>/dev/null)
          AKS_RG=$(terraform output -raw aks_rg 2>/dev/null)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RG" ]; then
            echo "AKS outputs not available. Skipping Kubernetes cleanup."
            exit 0
          fi

          echo "Getting AKS credentials for $AKS_NAME in $AKS_RG..."
          az aks get-credentials \
            -g "$AKS_RG" \
            -n "$AKS_NAME" \
            --admin \
            --overwrite-existing

          echo "Deleting ingress-nginx LoadBalancer Service if it exists..."
          kubectl -n ingress-nginx delete svc ingress-nginx-controller --ignore-not-found=true

          echo "Deleting ingress-nginx namespace if it exists..."
          kubectl delete namespace ingress-nginx --ignore-not-found=true

          echo "Waiting briefly for Azure Load Balancer detach..."
          sleep 60

          set -e

      - name: terraform destroy plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: terraform destroy apply
        run: terraform apply -auto-approve destroy.tfplan

      - name: Verify prod resource group removed
        run: |
          set +e
          az group show -n rg-azproj-prod --query name -o tsv >/tmp/rg-check.txt 2>/tmp/rg-error.txt
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "WARNING: rg-azproj-prod still exists:"
            cat /tmp/rg-check.txt
            exit 1
          fi

          echo "rg-azproj-prod not found. Destroy verification passed."