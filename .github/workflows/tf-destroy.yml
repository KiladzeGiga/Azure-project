name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm prod destruction'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-terraform
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy prod infrastructure
    runs-on: ubuntu-latest
    environment: prod

    if: github.event.inputs.confirm_destroy == 'DESTROY'

    defaults:
      run:
        working-directory: infra/live/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-azproj-tfstate" \
            -backend-config="storage_account_name=stazprojbn0pn1" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=prod.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform destroy plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy apply
        run: terraform apply -auto-approve destroy.tfplan

      - name: Verify prod resource group removed
        run: |
          set +e
          az group show -n rg-azproj-prod --query name -o tsv >/tmp/rg-check.txt 2>/tmp/rg-error.txt
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "WARNING: rg-azproj-prod still exists:"
            cat /tmp/rg-check.txt
            exit 1
          fi

          echo "rg-azproj-prod not found. Destroy verification passed."