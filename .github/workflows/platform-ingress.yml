name: platform-ingress

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-platform
  cancel-in-progress: false

jobs:
  ingress:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (backend)
        working-directory: infra/live/prod
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=prod.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Read platform outputs
        id: platform
        working-directory: infra/live/prod
        run: |
          echo "aks_name=$(terraform output -raw aks_name)" >> $GITHUB_OUTPUT
          echo "aks_rg=$(terraform output -raw aks_rg)" >> $GITHUB_OUTPUT
          echo "ingress_public_ip=$(terraform output -raw ingress_public_ip)" >> $GITHUB_OUTPUT

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup helm
        uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            -g "${{ steps.platform.outputs.aks_rg }}" \
            -n "${{ steps.platform.outputs.aks_name }}" \
            --admin \
            --overwrite-existing

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx \
            --set controller.service.type=LoadBalancer \
            --set controller.service.loadBalancerIP="${{ steps.platform.outputs.ingress_public_ip }}" \
            --set controller.service.externalTrafficPolicy=Local \
            --set-string controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-resource-group"="${{ steps.platform.outputs.aks_rg }}" \
            --set-string controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"="/healthz" \
            --wait --timeout 5m

      - name: Verify ingress-nginx
        run: |
          set -e

          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s

          EXPECTED_IP="${{ steps.platform.outputs.ingress_public_ip }}"
          echo "Expected IP: $EXPECTED_IP"

          for i in {1..60}; do
            ACTUAL_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            echo "Attempt $i: Actual IP: ${ACTUAL_IP:-<pending>}"

            if [ "$ACTUAL_IP" = "$EXPECTED_IP" ]; then
              echo "Ingress public IP assigned correctly."
              kubectl -n ingress-nginx get svc ingress-nginx-controller -o wide
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for ingress public IP."
          kubectl -n ingress-nginx get svc ingress-nginx-controller -o wide
          kubectl -n ingress-nginx describe svc ingress-nginx-controller
          exit 1
      - name: Debug ingress-nginx service
        run: |
          echo "---- ingress-nginx service yaml ----"
          kubectl -n ingress-nginx get svc ingress-nginx-controller -o yaml

          echo "---- ingress-nginx service describe ----"
          kubectl -n ingress-nginx describe svc ingress-nginx-controller

          echo "---- ingress-nginx pods ----"
          kubectl -n ingress-nginx get pods -o wide

          echo "---- test public IP directly ----"
          curl -sv --connect-timeout 5 --max-time 15 http://20.126.28.109/healthz || true

          echo "---- test DNS host with forced resolve ----"
          curl -sv --connect-timeout 5 --max-time 15 \
            --resolve api.gkiladze.space:80:20.126.28.109 \
            http://api.gkiladze.space/healthz || true